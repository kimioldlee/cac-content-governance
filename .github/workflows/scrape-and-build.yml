name: scrape-and-build

on:
  workflow_dispatch:
    inputs:
      scrape_date:
        description: '采集截止日期，YYYY-MM-DD；留空使用北京时间当天'
        required: false
        type: string
  schedule:
    - cron: '20 17 * * *'

permissions:
  contents: write

jobs:
  scrape-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run date
        id: run-date
        shell: bash
        run: |
          if [ -n "${{ inputs.scrape_date }}" ]; then
            run_date="${{ inputs.scrape_date }}"
          else
            run_date="$(TZ=Asia/Shanghai date +%F)"
          fi
          python - <<'PY' "$run_date"
          import datetime, sys
          datetime.date.fromisoformat(sys.argv[1])
          PY
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect CAC notices
        env:
          SCRAPE_CUTOFF: ${{ steps.run-date.outputs.run_date }}
        run: python work/collect.py

      - name: Build v1 deliverables
        env:
          SCRAPE_DATE: ${{ steps.run-date.outputs.run_date }}
        run: python work/build.py

      - name: Build v2 deliverables
        env:
          SCRAPE_DATE: ${{ steps.run-date.outputs.run_date }}
        run: python work/build_v2.py

      - name: Validate outputs
        env:
          SCRAPE_DATE: ${{ steps.run-date.outputs.run_date }}
        run: python work/validate_outputs.py

      - name: Upload scrape snapshot and outputs
        uses: actions/upload-artifact@v4
        with:
          name: cac-governance-${{ steps.run-date.outputs.run_date }}
          retention-days: 30
          if-no-files-found: error
          path: |
            work/html
            work/lists
            work/corpus.json
            work/index.json
            work/coverage.json
            outputs

      - name: Commit generated results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m "Update CAC governance corpus and rules (${{ steps.run-date.outputs.run_date }})"
          git push
